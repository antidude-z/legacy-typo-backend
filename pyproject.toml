[project]
name = "typography-backend"
version = "0.1.0"
description = "Compatibility backend for the legacy typography application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.38",
    "bcrypt==4.2.1",
    "pymysql==1.1.1",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "reportlab>=5.1.0",
    "xlwt>=1.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pypdf>=7.0.0",
    "xlrd>=2.0.2",
]
